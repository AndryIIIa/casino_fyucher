<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Виртуальное Казино</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="auth" class="card hidden">
  <h1>🎰 Казино</h1>
  <input id="username" placeholder="Логин">
  <input id="password" type="password" placeholder="Пароль">
  <button onclick="register()">Регистрация</button>
  <button onclick="login()">Вход</button>
  <p id="authMsg" class="msg"></p>
</div>

<div id="game" class="hidden">
  <div class="topbar">
    <span>👤 <b id="uname"></b></span>
    <span>💰 Баланс: <b id="balance">0</b> ₽</span>
    <button onclick="logout()">Выйти</button>
  </div>

  <div class="games">
    <div class="card">
      <h2>Монетка (x2)</h2>
      <input id="coinBet" type="number" placeholder="Ставка" min="1">
      <div>
        <button onclick="coin('heads')">Орёл</button>
        <button onclick="coin('tails')">Решка</button>
      </div>
      <p id="coinMsg" class="msg"></p>
    </div>

    <div class="card">
      <h2>Кубик (x5)</h2>
      <input id="diceBet" type="number" placeholder="Ставка" min="1">
      <input id="diceGuess" type="number" placeholder="Число 1-6" min="1" max="6">
      <button onclick="dice()">Бросить</button>
      <p id="diceMsg" class="msg"></p>
    </div>

    <div class="card">
      <h2>Слоты</h2>
      <input id="slotsBet" type="number" placeholder="Ставка" min="1">
      <button onclick="slots()">Крутить</button>
      <p id="slotsMsg" class="msg"></p>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
